[tool.micropython-stubber]
stub-path = "./repos/micropython-stubs/stubs"
repo-path = "./repos"
# mpy-path = "./micropython"
# mpy-liv-path = "./micropython-lib"
# publish-path = "./repos/micropython-stubs/publish"
# template-path = "./repos/micropython-stubs/publish/template"


[project]
name = "micropython-stubber"
dynamic = ["version"]
description = "Tooling to create and maintain stubs for MicroPython"
authors = [{ name = "Jos Verlinde", email = "jos_verlinde@hotmail.com" }]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.10,<4.0"
keywords = [
    "MicroPython",
    "stubs",
    "vscode",
    "pyright",
    "linting",
    "static type check",
]
classifiers = [
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "python-minifier>=2.7.0,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    "mpflash>=1.28.0,<2.0.0",
    "greenlet>=3.2.4,<3.2.5",                              # Constrain to version with pre-built wheels
    "mpremote>=1.25.0",
    # others
    "autoflake>=1.7,<3.0",
    "libcst>=1.1.0,<2.0.0",
    "cachetools>=5.3.0,<6.0.0",
    "diskcache>=5.6.0,<6.0.0",
    "click>=8.1.3,<9.0.0",
    "executing>=2.0.1,<3.0.0",
    "importlib-metadata>=1,<9; python_version < '3.8'",
    "loguru>=0.6,<0.8",
    "mypy-gitlab-code-quality>=1.1.0,<2.0.0",
    "packaging>=24.2,<25.0.0",
    "pygithub>=2.1.1,<3.0.0",
    "pyserial>=3.5",
    "pypi-simple>=1.0.0,<2.0.0",
    "rich-click>=1.8.3,<2.0.0",
    "tenacity==9.0.0",
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0,<2.0.0",
    "typed-config>=1.3.0,<2.0.0",
    "urllib3>=2.2.2,<3.0.0",
    "pydeps==3.0.1",
    "pyright>=1.1.341",
    "mypy>=1.10",
    "mpy-cross>=1.25.0.post2,<2.0.0",
    "ruff>=0.12.11,<0.13.0",
]

[project.urls]
Documentation = "https://micropython-stubber.readthedocs.io/"
Homepage = "https://github.com/Josverl/micropython-stubber#readme"
Repository = "https://github.com/Josverl/micropython-stubber"

[project.scripts]
stubber = "stubber.stubber:stubber_cli"
mpflash = "mpflash.cli_main:mpflash"
mpremote = "mpremote.main:main"

[dependency-groups]
docs = [
    "sphinx>=7.4.7,<8.0.0",
    "myst-parser>=3.0.1,<4.0.0",
    "sphinx_rtd_theme>=1,<3",
    "sphinx-autoapi>=3.6.0,<4.0.0",
    "sphinx-click==6.0.0",
    "sphinxcontrib-mermaid>=1.0.0",
]
test = [
    "coverage>=6.4.3,<8.0.0",
    "pytest>=7.1.2,<10.0.0",
    "pytest-github-actions-annotate-failures>=0.1.7,<0.3.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "pytest-metadata>=2.0.2,<4.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "mock>=4.0.3,<5.0.0",
    "distro>=1.8.0,<2.0.0",
    "fasteners>=0.19,<0.20",
    "jsons>=1.6.3,<2.0.0",
    "pytest-cov>=6.0.0",
]
dev = [
    "pydeps>=1.10.22,<4.0.0",
    "ipykernel>=6.23.1,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydocstyle>=6.3.0,<7.0.0",
    "chime>=0.7.0,<0.8.0",
    "bincopy>=20.0.0,<21.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/stubber/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stubber"]
exclude = [
    "**/tests/**",
    "**/*-test",
    "**/samples.py",
    "**/OneOff",
    "**/.vscode",
]

[tool.hatch.build.targets.sdist]
include = ["src/stubber"]

# Version bumping across source, package manifests and mip metadata.
# Run with: uvx bump-my-version bump patch   (or: minor / major / prerelease)
[tool.bumpversion]
current_version = "1.28.3"
allow_dirty = true

[[tool.bumpversion.files]]
filename = "src/stubber/__init__.py"

[[tool.bumpversion.files]]
filename = "src/stubber/board/createstubs.py"

[[tool.bumpversion.files]]
filename = "src/stubber/board/createstubs_mem.py"

[[tool.bumpversion.files]]
filename = "src/stubber/board/createstubs_db.py"

[[tool.bumpversion.files]]
filename = "src/stubber/board/createstubs_min.py"

[[tool.bumpversion.files]]
filename = "src/stubber/board/createstubs_mem_min.py"

[[tool.bumpversion.files]]
filename = "src/stubber/board/createstubs_db_min.py"

[[tool.bumpversion.files]]
filename = "package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "mip/full.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "mip/minified.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "mip/mpy_v5.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "mip/mpy_v6.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "snippets",
    "src/stubber/board",
    "src/stubber/board/*_min.py",

    "**/all-stubs",
    "src/stubber/board/stubs",
    "**/.venv",
]
ignore = [
    "tests/mocks",
    "tests/data",
    "tests/codemods",
    "**/cst-test",
    "snippets/**/typings",
]

# section 1
pythonVersion = "3.9"
pythonPlatform = "All"
verboseOutput = false
typeCheckingMode = "standard" # ["off", "basic", "strict"]: Specifies the default rule set to use
# section 2
reportMissingImports = "error"
reportGeneralTypeIssues = "error"                 # interesting
reportUndefinedVariable = "warning"               # "_WHO_AM_I_REG" is not defined - Not a showstopper
reportOptionalCall = "information"                #  Object of type "None" cannot be called
reportInvalidStringEscapeSequence = "information"
reportUnboundVariable = "information"
ReportSelfClsParameterName = "information"
reportOptionalSubscript = "information"
reportCallInDefaultInitializer = "error"
# reportAssignmentType = "warning"
# Section 3 -  reduce noise 
reportMissingTypeStubs = "none"
reportOptionalMemberAccess = "none"      # "read" is not a known member of "None" - occurs often in frozen code
reportWildcardImportFromLibrary = "none"
reportUnknownArgumentType = "none"
reportSelfClsParameterName = "none"
reportMissingModuleSource = "none"
reportUnknownParameterType = "none"
reportMissingTypeArgument = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUntypedNamedTuple = "none"



# "executionEnvironments" = [
#     { "root" = "src/stubber/boards", "extraPaths" = [
#         "typings_mpy",
#     ] },
#     { "root" = "src/stubber", "extraPaths" = [
#     ] },
# ]


[tool.pytest.ini_options]
minversion = "7.0"
python_functions = ["test_", "*_test"]
python_files = ["test_*.py", "*_test.py"]
testpaths = [
    "tests",
    "src/stubber",
    # "repos/micropython-stubs/tests",
]
norecursedirs = [
    ".*",
    ".*/*",
    # "repos/*",
    "tests/codemods/codemod_test_cases/*",
    "typings*",
]
junit_family = "xunit1"

addopts = "--verbose --capture=no -m 'not basicgit'"
#  -m 'not snippets'
# --numprocesses=auto 
# -m MARKEXPR           Only run tests matching given mark expression. For example: -m 'mark1 and not mark2'.
# -n --numprocesses=numprocesses - 

markers = [
    "stubber: marks tests of the stubber tool",
    "snippets: test snippets to check the stubs",

    "legacy: reeally old tests that need to be updated or removed",

    "version: run test only on specific MicroPython version",

    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: Integration tests (slower)",
    "basicgit: marks tests in the basicgit module that manipulate the checkout",
    "mocked: to replace/compensate for most of the slow and git tests",
    #
    "minified: marks test of the minified version of createstubs",
    "minify: marks test of the minification of createstubs",
    "native: Createstubs run against a native micropython implementation",
    "docfix: upstream documentation fix needed",
    "micropython: tests of MicroPython code on Cpython with mocks",
    "doc_stubs: tests to generate stubs from the rst documentation",
    "codemod: test libcst code modification",
    "cli: test command line interface",
    # os platforms
    "win32: run test only on Windows",
    "linux: run test only on linux",
    "darwin: run test only on Mac",
    # micropython version dependencies 


]

# coverage reports

[tool.coverage.run]
parallel = false
branch = true
source = ["src/stubber"]
omit = [
    # helper files in board
    "*/boot.py",
    "*/main.py",
    "*/stub_lvgl.py",

    # dev helper script in src
    "*/src/stubber/rst/report_return.py",
    "*/src/stubber/update_module_list.py",

    # not my code 
    "*/src/stubber/tools/*.py",

    # partial files for variant generation
    "*/codemod/_partials/*.py",

    # pytest code
    "*/test_*.py",
    "*/*_test.py",
]


[tool.coverage.html]
directory = "coverage"

[tool.coverage.xml]
output = "results/coverage.xml"

[tool.coverage.json]
output = "results/coverage.json"

[tool.coverage.lcov]
output = "results/coverage.lcov"

[tool.coverage.report]
show_missing = true
# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    "pragma: nocover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "self._log.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    "except subprocess.CalledProcessError as e:",
    "except OSError:",
    "except OSError as e:",
    "except OSError as e2:",
    "except (OSError, KeyError):",
    "except (OSError, AttributeError):",
    "except (OSError, KeyError, NameError):",
    "except KeyError:",
    "except AttributeError as e:",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",

    # mind the quotes 
    'if __name__ == "__main__" or isMicroPython():',
    "main()",

    # utility functions
    "show_help()",
    "isMicroPython()",
    "read_path()",

    #unreachable
    # mind the quotes 
    'info["release"] = "2.0.0" ',
    "if arch",

    # Micropython detection
    "except (NotImplementedError, SyntaxError):",
    # catch error
    "except (OSError, KeyError):",
    "except (OSError, AttributeError):",

    # Backward compat <= 3.7 
    "if sys.version_info.major == 3 and sys.version_info.minor <= 7:",

]

[tool.sourcery-analytics]

[tool.sourcery-analytics.thresholds]
method_length = 50
method_cyclomatic_complexity = 99
method_cognitive_complexity = 99
method_working_memory = 99


[tool.ruff]
# Exclude a variety of commonly ignored directories.

# Same as Black.
line-length = 140
indent-width = 4

#Stubs should be usable Python 3.9
target-version = "py39"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
exclude = [
    ".*", "__*", "dist", 
    "minified",
    "repos/micropython",
    "repos/micropython-lib", 
    "repos/micropython-stubs",
    "tests/mocks",
    "tests/data",
    "tests/rst/data",
    "tests/codemods/codemod_test_cases",
    "typings",
    "snippets/*/typings",
    "scratch",
    "src/stubber/codemod/_partials"
]

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
exclude = [
    ".*", "__*", "dist",
    "minified", 
    "repos/micropython",
    "repos/micropython-lib",
    "repos/micropython-stubs", 
    "tests/mocks",
    "tests/data",
    "tests/rst/data",
    "tests/codemods/codemod_test_cases",
    "typings",
    "snippets/*/typings",
    "scratch", 
    "src/stubber/codemod/_partials"
]
