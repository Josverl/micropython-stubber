# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-20.04
  tools:
    python: "3.11"
  commands:
    # Install uv
    - pip install uv
    # Install dependencies with the 'docs' dependency group
    - uv sync --group docs
    # Build documentation using uv-managed Sphinx
    - uv run sphinx-build -T -b html -d _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html

# Formats handled by custom commands above
# formats:
#   - pdf
