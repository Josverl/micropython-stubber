name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without the v prefix
        required: true
        type: string
      commit:
        description: Exact version commit to test and release
        required: true
        type: string

# The release recipe dispatches this workflow after pushing the version commit.

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Validate release version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              actual = tomllib.load(pyproject_file)["tool"]["bumpversion"]["current_version"]

          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"Requested version {expected!r}, but commit contains {actual!r}")
          PY

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  tests:
    needs: prepare
    uses: ./.github/workflows/pytest.yml
    with:
      ref: ${{ inputs.commit }}
    secrets: inherit

  create-tag:
    needs: [build, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - name: Create release tag
        env:
          TAG: v${{ inputs.version }}
        run: |
          git tag --annotate "${TAG}" --message "Release ${TAG}"
          git push origin "${TAG}"

  publish-pypi:
    needs: [build, create-tag]
    runs-on: ubuntu-latest
    # The `pypi` environment matches the trusted-publisher config on PyPI.
    # Pair this with an environment protection rule (Settings -> Environments
    # -> pypi -> Required reviewers) for a manual approval gate.
    environment:
      name: pypi
      url: https://pypi.org/project/micropython-stubber/
    permissions:
      # Required for PyPI trusted publishing via OIDC. No PyPI token needed.
      id-token: write
    steps:
      - name: Download distribution artefacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so --generate-notes can resolve the previous tag.
          fetch-depth: 0

      - name: Download distribution artefacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
        run: |
          gh release create "${TAG}" dist/* \
            --generate-notes \
            --title "${TAG}"
